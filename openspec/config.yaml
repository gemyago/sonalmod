schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# To tweak models used by orchestrator, create orchestrator-config.yaml
# And use below template to tweak which models to use. This can help to save the budget
# sub-agents:
#   implementer:
#     model: gpt-5.3-codex
#     reasoning_effort: medium
#   verifier:
#     model: gpt-5.4-mini
#     reasoning_effort: medium
#   fixer:
#     model: gpt-5.3-codex
#     reasoning_effort: high

rules:
  tasks:
    - |
      When breaking down the design on tasks: each task must be self contained and must leave the codebase in a "green state". This means that gradual refactoring techniques must be followed if breaking changes are introduced
