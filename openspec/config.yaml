schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# To tweak models used by orchestrator, create orchestrator-config.yaml
# And use below template to tweak which models to use. This can help to save the budget
# sub-agents:
#   implementer:
#     model: gpt-5.3-codex
#     reasoning_effort: medium
#   verifier:
#     model: gpt-5.4-mini
#     reasoning_effort: medium
#   fixer:
#     model: gpt-5.3-codex
#     reasoning_effort: high

rules:
  proposal:
    - Do your best at figuring out all the details yourself. Create and write proposal automatically without asking for clarification. User will read and correct it as needed. This applies do design as well.
  design: 
    - |
      **Do Research:** Before creating the plan, the AI *must* do the research of the codebase to gather sufficient detail.

      The AI should adapt its research areas based on the prompt, but here are some common questions to explore:

      *   **Problem/Goal:** "What problem does this feature solve?" or "What is the main goal we want to achieve with this change?"
      *   **Core Functionality:** "What is a core functionality that this work should enable?"
      *   **Acceptance Criteria:** "How will we know when this feature is successfully implemented? What are the key success criteria?"
      *   **Scope/Boundaries:** "Are there any specific things this feature *should not* do (non-goals)?"
      *   **Data Requirements:** "What kind of data does this feature need to display or manipulate?"
      *   **Design/UI:** "Are there any existing design mockups or UI guidelines to follow?" or "Can you describe the desired look and feel?"
      *   **Edge Cases:** "Are there any potential edge cases or error conditions we should consider?"

      AI should do it's best to understand what needs to be built. Any small uncertainties should be listed in the resulting plan document. AI should **only** ask clarifying questions if the initial prompt is highly ambiguous and the AI has failed to understand the final outcome.

      The generated design may include the following sections when applicable:
      1. **Business Logic:** Describe (in words) main aspects of the business logic that will be implemented.
      2. **High Level Architecture:** Describe the high level architecture of the feature, list components involved.
      3. **Detailed Architecture:** For each component involved, describe how it will work and structured, which files may need to be created or updated
      4. **Key Architectural Decisions:** List key architectural decisions that were made.
      5. **Uncertainties:** List any uncertainties (if present) or areas needing further clarification.
      6. **Related Files** List all files related to the change. If new files needs to be created - mention them as well.
  tasks:
    - |
      When breaking down the design on tasks: each task must be self contained and must leave the codebase in a "green state". This means that gradual refactoring techniques must be followed if breaking changes are introduced (e.g add new thing, update everything, drop old thing e.t.c)
    - |
      TDD must be preferred for all tasks that involve adding or updating any logic. This means:
      * Write test first
      * Add code stub if needed
      * Run test to ensure failure (execution not compilation)
      * Implement the minimal amount of code to make the test pass
      * Repeat the process until the feature is complete
