schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

tasks:
  - "Always add a trailing task to run repo level checks. The task should say 'Run repo level checks' fix issues and re-run the task until all checks are green."

rules:
  - "Make sure to understand the project context using AGENTS.md hierarchy"
  - "Before completing a task, always follow task completion protocol as per project conventions (e.g make affected-lint-test)"
