schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  tasks:
    - |
      Inject the following instruction into the heading of the tasks. Note: it must follow before tasks list and must be it's own heading instruction:
      ```markdown
      ## Important Apply Phase Constraint
      Applying phase must follow [orchestrate-tasks](../../orchestrate-tasks.md) instruction.
      ---
      ```
    - |
      When breaking down the design on tasks: each task must be self contained and must leave the codebase in a "green state". This means that gradual refactoring techniques must be followed if breaking changes are introduced.
