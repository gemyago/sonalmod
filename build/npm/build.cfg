# build/npm/build.cfg
#
# Build configuration for npm release pipeline.
# Read by build/npm/Makefile using the read_config function.

# Platforms to build in GOOS/GOARCH format (comma-separated, no spaces).
# Maps to npm os/cpu via scripts/resolve-npm-platform.sh:
#   linux/amd64    -> @sonalmod/app-linux-x64    (os: linux,  cpu: x64)
#   linux/arm64    -> @sonalmod/app-linux-arm64  (os: linux,  cpu: arm64)
#   darwin/arm64   -> @sonalmod/app-darwin-arm64 (os: darwin, cpu: arm64)
#   windows/amd64  -> @sonalmod/app-win32-x64    (os: win32,  cpu: x64)
platforms = linux/amd64,linux/arm64,darwin/arm64,windows/amd64

# npm scope for all published packages
npm_scope = @sonalmod

# Semver used for dist/VERSION when HEAD is not refs/tags/* (local dev, CI on branches).
dev_version = 0.0.0-dev
