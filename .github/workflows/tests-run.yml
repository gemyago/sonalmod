name: Tests

on:
  workflow_call:

jobs:
  tests-run:
    name: Run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # We need to fetch all branches and commits so that Nx affected has a base to compare against.
          fetch-depth: 0
          filter: tree:0 # Reduce the size of the checkout with tree filtering, see https://github.blog/open-source/git/get-up-to-speed-with-partial-clone-and-shallow-clone/

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/sonal-ui/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            runtime/go.sum
            apps/**/go.sum
            tools/**/go.sum

      - name: Setup golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-only: true
          version-file: .golangci-version

      - name: Run lint
        run: npx nx affected --target=lint --parallel=3

      - name: Run tests
        run: npx nx affected --target=test --parallel=3
