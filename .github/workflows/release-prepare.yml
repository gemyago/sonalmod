# Manual step: create a *draft* GitHub Release for v<VERSION> with generated notes.
# Publishing that draft triggers `release-publish.yml` (release: types [released]).
name: Release Prepare

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without leading v (e.g. 1.2.3 or 1.2.3-alpha.1)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-prepare-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Draft release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version input
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "version must look like semver (e.g. 1.2.3 or 1.2.3-alpha.1)" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # --target: tag is created when the draft is *published* (see GitHub docs).
          # Requires gh (preinstalled on GitHub-hosted runners).
          gh release create "v${VERSION}" \
            --draft \
            --generate-notes \
            --target "${{ github.event.repository.default_branch }}" \
            --title "v${VERSION}"
